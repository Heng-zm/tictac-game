<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Tic Tac Toe">
  <defs>
    <linearGradient id="bg" x1="64" y1="24" x2="448" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb"/>
      <stop offset=".52" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(128 88) rotate(43) scale(420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bfdbfe" stop-opacity=".48"/>
      <stop offset=".7" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="256" y1="250" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity=".3"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect y="250" width="512" height="262" fill="url(#shade)"/>

    <g fill="none" stroke="#fff" stroke-linecap="round">
      <path d="M256 84v344M84 256h344" stroke-width="9" stroke-opacity=".14"/>
      <path d="M120 120 228 228M228 120 120 228" stroke-width="42"/>
      <circle cx="340" cy="340" r="62" stroke="#fde68a" stroke-width="40"/>
    </g>

    <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
  </g>
</svg>
